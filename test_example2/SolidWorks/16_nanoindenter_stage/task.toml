schema_version = "1.4"

[task]
name = "storygold/solidworks-0016-nanoindenter-stage"
version = "1.0.0"
description = "Cross-functional change requests for an in-situ tension/compression test stage"
keywords = ["solidworks", "cad", "design_iteration"]

[[task.authors]]
name = "StoryGold"

[metadata]
complete = true
program = "SolidWorks"
category = "design_iteration"
units = "mm"
human_baseline_minutes = 180
output_modality = "cad"
notes = "harness.py grades a live SolidWorks session over COM, measuring named components directly (Belt Guard, Fixture, GT2 belt, the GPA40GT2060-B-H6.35/H8 pulley subassemblies). File-identity fix: the real, fully-populated stage assembly in this task family was misnamed 'YSZ clamp.SLDASM' (with an abandoned 2-part 'Main.SLDASM' stub mistakenly registered as the primary input/reference, and copied under that same stub content into every examples/adversarial_* folder's 'adversarial_*.SLDASM' file) -- environment/, solution/, and all 8 examples/adversarial_* folders have been renamed to the standard input.SLDASM / solution.SLDASM / adversarial_*.SLDASM convention. KNOWN GAP, confirmed live: solution/solution.SLDASM's own 'Belt Guard-1' component carries a genuine hard rebuild error (not a stale-error-code artifact -- confirmed via GetErrorCode2's warning/error distinction after a forced rebuild), so the reference solution itself currently fails the 'model rebuilds without errors' must-pass gate; every other check passes on it. NOT machine-graded (see harness.py's docstring): bolt/part collision avoidance for the belt cover, tool-free attach/detach without disassembly, milling-specific manufacturability features, and mounting-hole relocation on the enclosure body (coordinate-frame limitation, not attempted)."
accepted_output_formats = ["sldasm"]
reference = ["solution/solution.SLDASM"]
max_score = 10

[[metadata.scoring_components]]
name = "model rebuilds without errors"
weight = 0

[[metadata.scoring_components]]
name = "belt cover covers both pulleys and the belt (incl. new pulley size)"
weight = 1

[[metadata.scoring_components]]
name = "belt cover has mounting fasteners"
weight = 1

[[metadata.scoring_components]]
name = "belt cover is sheet-metal manufacturable"
weight = 1

[[metadata.scoring_components]]
name = "side plate removed"
weight = 1

[[metadata.scoring_components]]
name = "fixture plate lengthened for t-slot mounting"
weight = 1

[[metadata.scoring_components]]
name = "fixture plate has new M8 mounting holes or slots"
weight = 1

[[metadata.scoring_components]]
name = "motor shaft pulley changed to 60T (larger diameter)"
weight = 1

[[metadata.scoring_components]]
name = "pulley thickness and bore diameter unchanged"
weight = 1

[[metadata.scoring_components]]
name = "pulley cover (flange) resized to fit the new pulley"
weight = 1

[[metadata.scoring_components]]
name = "timing belt adjusted to the new pulley layout"
weight = 1

[metadata.harness]
entrypoint = "harness/harness.py"
timeout_s = 300.0
requires_solidworks = true
requires_freecad = false
requires_llm = false

