[verifier]
# TODO: verifier.environment_mode -- the harness grades whatever SolidWorks
# document is currently open via COM (pywin32), not a file handed to a
# headless verifier process. Decide once the real Windows+SolidWorks
# environment exists whether verification runs "shared" with the agent's
# live SolidWorks session or some other arrangement Harbor doesn't
# currently model for GUI apps.
timeout_sec = 1500.0

[verifier.env]

[agent]
timeout_sec = 1500.0
# TODO: user -- which Windows user account the agent (and SolidWorks) run
# as. Depends on how SolidWorks licensing/activation is set up on the
# target machine.

[environment]
os = "windows"
network_mode = "public"
build_timeout_sec = 1500.0
# TODO: cpus / memory / storage -- SolidWorks' real resource needs on the
# target Windows host aren't known from here.

[environment.env]
# TODO: FREECAD-style env var isn't applicable; SolidWorks is driven via
# COM (win32com.client.Dispatch("SldWorks.Application")), which needs a
# running, licensed SolidWorks process -- not an env var pointing at a
# binary.

[solution.env]
